<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fesla Motors | $FESLA on Solana</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        feslaRed: '#E82127',
                        feslaDark: '#0D0E11',
                        feslaCard: '#171A20',
                        feslaGray: '#22262F',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg) scale(1)' },
                            '50%': { transform: 'translateY(-15px) rotate(5deg) scale(1.03)' },
                        },
                        spin3d: {
                            '0%': { transform: 'rotateY(0deg) translateY(0px)' },
                            '50%': { transform: 'rotateY(180deg) translateY(-10px)' },
                            '100%': { transform: 'rotateY(360deg) translateY(0px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { filter: 'drop-shadow(0 0 15px rgba(232,33,39,0.4))' },
                            '50%': { filter: 'drop-shadow(0 0 35px rgba(232,33,39,0.8))' },
                        }
                    },
                    animation: {
                        float: 'float 6s ease-in-out infinite',
                        spin3d: 'spin3d 8s linear infinite',
                        pulseGlow: 'pulseGlow 3s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <!-- Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- React & Babel Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .bg-grid-pattern {
            background-size: 32px 32px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        }
        .glass-panel {
            background: rgba(23, 26, 32, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Smooth Slide Transition Styles */
        .hero-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 8s ease-out;
            transform: scale(1.05);
            will-change: opacity, transform;
        }
        .hero-slide.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 3D Round Coin Container */
        .coin-3d-wrapper {
            perspective: 1000px;
        }
        .coin-3d-element {
            border-radius: 9999px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0D0E11; }
        ::-webkit-scrollbar-thumb { background: #22262F; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #E82127; }
    </style>
</head>
<body class="bg-feslaDark text-white font-sans antialiased overflow-x-hidden selection:bg-feslaRed selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONTRACT_ADDRESS = "FeslaSolanaMemeCoin69420PumpDotFunContract420";

        // Daftar Gambar Hero Slide (Hanya heroslide1, heroslide2, herofirst)
        const HERO_SLIDES = [
            "heroslide1",
            "heroslide2",
            "herofirst"
        ];

        function App() {
            const [copied, setCopied] = useState(false);
            const [solAmount, setSolAmount] = useState(1);
            const [solPrice, setSolPrice] = useState(185.50);
            const [selectedModel, setSelectedModel] = useState("Model F");
            const [modalOpen, setModalOpen] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            // State Hero Slide
            const [currentSlide, setCurrentSlide] = useState(0);

            // FSD Logs state
            const [logs, setLogs] = useState([
                "[0.00s] Connected to Solana Mainnet-Beta RPC Node...",
                "[0.15s] Scanning Raydium & Orca DEX pools...",
                "[0.42s] Detecting meme sentiment spike: +340%",
                "[0.88s] Solana TPS: 3,450 | Block Time: 410ms",
                "[1.05s] Auto-buying dip on $FESLA/SOL liquidity pair..."
            ]);

            // Auto Slide Effect
            useEffect(() => {
                const slideInterval = setInterval(() => {
                    setCurrentSlide((prev) => (prev + 1) % HERO_SLIDES.length);
                }, 5000);
                return () => clearInterval(slideInterval);
            }, []);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [modalOpen, mobileMenuOpen, logs, currentSlide]);

            useEffect(() => {
                const interval = setInterval(() => {
                    const sampleLogs = [
                        "Executing high-frequency arbitrage on Orca...",
                        "Raydium Concentrated Liquidity rebalanced.",
                        "Solana Validator #402 confirmed block #294,102,110.",
                        "Whale wallet swapped 150 SOL into $FESLA.",
                        "Full Self-Doge AI: Optimal buy order placed."
                    ];
                    const randomLog = sampleLogs[Math.floor(Math.random() * sampleLogs.length)];
                    const time = (Math.random() * 2).toFixed(2);
                    setLogs(prev => [...prev.slice(-6), `[${time}s] ${randomLog}`]);
                }, 3500);
                return () => clearInterval(interval);
            }, []);

            const copyContract = () => {
                const el = document.createElement('textarea');
                el.value = CONTRACT_ADDRESS;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);

                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const triggerOrder = () => {
                if (window.confetti) {
                    window.confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
                }
                setModalOpen(false);
            };

            const feslaPerSol = 5000000;
            const feslaReceived = solAmount * feslaPerSol;
            const usdValue = (solAmount * solPrice).toFixed(2);

            return (
                <div class="min-h-screen flex flex-col justify-between relative overflow-x-hidden">
                    
                    {/* NAVIGATION BAR */}
                    {}
                    <header class="fixed top-0 left-0 right-0 z-50 bg-feslaDark/90 backdrop-blur-md border-b border-white/5 px-6 py-4 flex items-center justify-between">
                        {/* Logo */}
                        <a href="#hero" class="flex items-center space-x-2">
                            <img src="logofesla.png" alt="Fesla Logo" class="h-8 w-auto object-contain" onError={(e) => { e.target.style.display='none'; if(e.target.nextElementSibling) e.target.nextElementSibling.style.display='flex'; }} />
                            <div class="hidden flex-col leading-none">
                                <div class="flex items-center space-x-1">
                                    <span class="text-feslaRed font-black text-2xl tracking-tighter">F.</span>
                                    <span class="text-white font-black text-xl tracking-[0.25em]">FESL</span>
                                </div>
                                <span class="text-white font-black text-xl tracking-[0.25em] pl-6">A</span>
                            </div>
                        </a>

                        {/* Desktop Nav */}
                        <nav class="hidden lg:flex items-center space-x-6 text-sm font-medium text-gray-300">
                            <a href="#solana-utilities" class="hover:text-white transition">Solana Utility</a>
                            <a href="#model-f" class="hover:text-white transition">Model F</a>
                            <a href="#cybertruck" class="hover:text-white transition">CyberTrash</a>
                            <a href="#fsd" class="hover:text-white transition">FSD Beta</a>
                            <a href="#tokenomics" class="hover:text-white transition">Tokenomics</a>
                            <a href="#roadmap" class="hover:text-white transition">Master Plan</a>
                        </nav>

                        {/* Actions */}
                        <div class="hidden sm:flex items-center space-x-3">
                            <button 
                                onClick={() => setModalOpen(true)}
                                class="bg-feslaRed hover:bg-red-700 text-white px-4 py-2 rounded-lg text-xs font-bold tracking-wider uppercase transition flex items-center space-x-2 shadow-lg shadow-feslaRed/20"
                            >
                                <i data-lucide="zap" class="w-4 h-4"></i>
                                <span>Custom Order</span>
                            </button>

                            <button 
                                onClick={copyContract}
                                class="bg-feslaCard hover:bg-feslaGray border border-gray-800 text-gray-200 px-3 py-2 rounded-lg text-xs font-mono transition flex items-center space-x-2"
                            >
                                <i data-lucide="layers" class="w-3.5 h-3.5 text-feslaRed"></i>
                                <span>{copied ? "COPIED!" : `${CONTRACT_ADDRESS.substring(0, 8)}...${CONTRACT_ADDRESS.substring(CONTRACT_ADDRESS.length - 4)}`}</span>
                                <i data-lucide="copy" class="w-3 h-3 text-gray-400"></i>
                            </button>
                        </div>

                        {/* Mobile Toggle */}
                        <button 
                            onClick={() => setMobileMenuOpen(!mobileMenuOpen)} 
                            class="lg:hidden text-gray-300 hover:text-white p-2"

                            <i data-lucide={mobileMenuOpen ? "x" : "menu"} class="w-6 h-6"></i>
                        </button>
                    </header>

                    {/* Mobile Drawer */}
                    {mobileMenuOpen && (

                            <a href="#solana-utilities" onClick={() => setMobileMenuOpen(false)} class="text-gray-300 hover:text-white py-2 text-lg">Solana Utility</a>
                            <a href="#model-f" onClick={() => setMobileMenuOpen(false)} class="text-gray-300 hover:text-white py-2 text-lg">Model F</a>
                            <a href="#cybertruck" onClick={() => setMobileMenuOpen(false)} class="text-gray-300 hover:text-white py-2 text-lg">CyberTrash</a>
                            <a href="#fsd" onClick={() => setMobileMenuOpen(false)} class="text-gray-300 hover:text-white py-2 text-lg">FSD Beta</a>
                            <a href="#tokenomics" onClick={() => setMobileMenuOpen(false)} class="text-gray-300 hover:text-white py-2 text-lg">Tokenomics</a>
                            <a href="#roadmap" onClick={() => setMobileMenuOpen(false)} class="text-gray-300 hover:text-white py-2 text-lg">Master Plan</a>

                                >
                                    Order Fesla Now

                                <button 
                                    onClick={copyContract} 
                                    class="w-full bg-feslaCard border border-gray-800 text-gray-300 py-3 rounded-lg font-mono text-xs text-center"
                                >
                                    {copied ? "Copied Address!" : "Copy Contract Address"}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* HERO SECTION WITH SMOOTH SLIDE BACKGROUND */}
                    {}
                    <section id="hero" class="relative min-h-screen flex flex-col justify-center items-end pt-28 pb-12 px-6 md:px-16 overflow-hidden">
                        
                        {/* Background Smooth Slider */}
                        <div class="absolute inset-0 z-0">
                            {HERO_SLIDES.map((slide, index) => (

                                        backgroundImage: `linear-gradient(90deg, rgba(13, 14, 17, 0.35) 0%, rgba(13, 14, 17, 0.95) 65%), url('${slide}')`

                        </div>

                        {/* ELEMEN COIN 3D MELAYANG */}
                        <div class="hidden md:flex absolute left-12 top-1/3 z-20 items-center justify-center pointer-events-none coin-3d-wrapper">
                            <div class="relative animate-float">
                                <img 
                                    src="coin3d" 
                                    alt="3D Fesla Coin" 
                                    class="w-48 h-48 lg:w-64 lg:h-64 rounded-full coin-3d-element animate-spin3d animate-pulseGlow border-2 border-feslaRed/40 p-1 bg-black/30 backdrop-blur-sm"
                                    onError={(e) => { e.target.src = 'logofesla.png'; }}
                                />
                                <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 bg-black/80 backdrop-blur-md px-4 py-1 rounded-full border border-feslaRed/50 text-[11px] font-mono font-bold text-feslaRed uppercase tracking-wider text-center shadow-lg">
                                    3D $FESLA Token
                                </div>
                            </div>
                        </div>

                        {/* Hero Content */}
                        <div class="w-full max-w-2xl space-y-6 text-right z-10 my-auto">
                            
                            <div class="inline-flex items-center space-x-2 px-3.5 py-1.5 bg-feslaRed/10 border border-feslaRed/40 text-feslaRed text-xs rounded-full font-bold uppercase tracking-wider">
                                <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
                                <span>Powered by Solana High-Speed Network</span>
                            </div>

                            <div class="space-y-1">
                                <h1 class="text-5xl md:text-7xl font-black tracking-tight text-white uppercase">FESLA MOTORS</h1>
                                <p class="text-gray-300 text-base md:text-lg font-medium">The World's Fastest Autonomous Meme Currency. Built on Solana.</p>
                            </div>

                            {/* Card Details */}
                            <div class="glass-panel p-6 md:p-8 rounded-3xl border border-white/10 shadow-2xl space-y-6 text-left relative">
                                <div class="md:hidden flex items-center space-x-3 mb-2 bg-feslaDark/80 p-2 rounded-xl border border-feslaRed/30">
                                    <img src="coin3d" alt="Fesla Coin" class="w-10 h-10 rounded-full animate-spin3d border border-feslaRed" />
                                    <span class="text-xs font-bold text-white uppercase tracking-wider">$FESLA 3D Element Active</span>
                                </div>

                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-800/80 pb-5">
                                    <div class="space-y-1">
                                        <h3 class="text-xs font-bold uppercase tracking-widest text-gray-400">Solana Token Contract Address</h3>
                                        <div class="flex items-center space-x-2">
                                            <code class="text-sm font-mono text-white font-bold truncate max-w-xs">
                                                {CONTRACT_ADDRESS}
                                            </code>
                                            <button 
                                                onClick={copyContract} 
                                                class="bg-feslaGray hover:bg-gray-700 text-white p-1.5 rounded-lg transition border border-gray-700 shrink-0"
                                                title="Copy Contract"
                                            >
                                                <i data-lucide={copied ? "check" : "copy"} class="w-4 h-4 text-feslaRed"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="flex items-center space-x-2">
                                        <a 
                                            href="https://solscan.io" 
                                            target="_blank" 
                                            class="bg-feslaGray hover:bg-gray-700 text-white text-xs px-3.5 py-2 rounded-xl font-medium flex items-center space-x-1.5 border border-gray-700 transition"
                                        >
                                            <span>Solscan</span>
                                            <i data-lucide="external-link" class="w-3 h-3 text-gray-400"></i>
                                        </a>
                                        <a 
                                            href="https://raydium.io" 
                                            target="_blank" 
                                            class="bg-feslaRed hover:bg-red-700 text-white text-xs px-3.5 py-2 rounded-xl font-bold flex items-center space-x-1.5 shadow-md shadow-feslaRed/20 transition"
                                        >
                                            <span>Trade Raydium</span>
                                            <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
                                        </a>
                                    </div>
                                </div>

                                <p class="text-xs md:text-sm text-gray-300 leading-relaxed">
                                    Fesla ($FESLA) combines electric meme velocity with the sub-second finality of Solana. Zero taxes, 100% burned liquidity pool, and real-time Solana DEX swap tools integrated directly into the dashboard.
                                </p>

                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                                    <div class="bg-feslaDark/90 p-3.5 rounded-xl border border-gray-800">
                                        <div class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">NETWORK SPEED</div>
                                        <div class="text-base font-black text-white mt-0.5">0.4s Block</div>
                                    </div>
                                    <div class="bg-feslaDark/90 p-3.5 rounded-xl border border-gray-800">
                                        <div class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">TRANSACTION FEE</div>
                                        <div class="text-base font-black text-white mt-0.5">&lt; $0.001</div>
                                    </div>
                                    <div class="bg-feslaDark/90 p-3.5 rounded-xl border border-gray-800">
                                        <div class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">TOTAL BATTERY</div>
                                        <div class="text-base font-black text-white mt-0.5">100B $FESLA</div>
                                    </div>
                                    <div class="bg-feslaDark/90 p-3.5 rounded-xl border border-gray-800">
                                        <div class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">LIQUIDITY STATUS</div>
                                        <div class="text-base font-black text-feslaRed mt-0.5">100% Burned</div>
                                    </div>
                                </div>
                            </div>

                            {/* Slide Indicators & Buttons */}
                            <div class="flex items-center justify-between pt-2">
                                <div class="flex items-center space-x-2">
                                    {HERO_SLIDES.map((_, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => setCurrentSlide(idx)}
                                            class={`h-2.5 rounded-full transition-all duration-300 ${idx === currentSlide ? 'w-8 bg-feslaRed' : 'w-2.5 bg-gray-600 hover:bg-gray-400'}`}
                                            title={`Slide ${idx + 1}`}
                                        />
                                    ))}
                                </div>

                                <button 
                                    onClick={() => setModalOpen(true)}
                                    class="bg-feslaRed hover:bg-red-700 text-white font-bold py-3.5 px-8 rounded-xl text-xs uppercase tracking-wider transition transform hover:scale-105 shadow-xl shadow-feslaRed/20 flex items-center space-x-2"
                                >
                                    <i data-lucide="car" class="w-4 h-4"></i>
                                    <span>Configure & Buy</span>
                                </button>
                            </div>

                        </div>
                    </section>

                    {/* SOLANA UTILITY SUITE SECTION */}
                    {}
                    <section id="solana-utilities" class="py-20 bg-feslaDark border-t border-gray-800 px-6 relative">
                        <div class="max-w-6xl mx-auto">
                            <div class="text-center max-w-3xl mx-auto mb-12">
                                <span class="text-feslaRed text-xs font-bold uppercase tracking-widest bg-feslaRed/10 border border-feslaRed/30 px-3 py-1 rounded-full">
                                    Functional On-Chain Tools
                                </span>
                                <h2 class="text-3xl md:text-4xl font-extrabold text-white mt-3">Solana Supercharger Utilities</h2>
                                <p class="text-gray-400 text-sm md:text-base mt-2">Real-time trading calculator, live liquidity estimator, and contract validator.</p>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div class="glass-panel p-6 rounded-2xl space-y-4 relative overflow-hidden">
                                    <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                                        <div class="flex items-center space-x-2">
                                            <i data-lucide="arrow-right-left" class="w-5 h-5 text-feslaRed"></i>
                                            <h3 class="font-bold text-white">Solana Swap Estimator</h3>

                                    </div>

                                    <div>

                                        <div class="relative">
                                            <input 
                                                type="number" 
                                                value={solAmount} 
                                                onChange={(e) => setSolAmount(Math.max(0.01, parseFloat(e.target.value) || 0))}
                                                class="w-full bg-feslaDark border border-gray-700 rounded-lg p-3 text-white font-bold text-lg focus:outline-none focus:border-feslaRed"
                                            />

                                    <div class="space-y-2 text-xs bg-feslaDark/80 p-3 rounded-lg border border-gray-800">

                                        <div class="flex justify-between text-gray-400">
                                            <span>Tokens Received:</span>
                                            <span class="text-white font-bold font-mono">{feslaReceived.toLocaleString()} $FESLA</span>

                                        <div class="flex justify-between text-gray-400">
                                            <span>Estimated Price Impact:</span>
                                            <span class="text-feslaRed">&lt; 0.01%</span>
                                        </div>
                                    </div>

                                    <a 
                                        href="https://raydium.io/swap"

                                        class="w-full bg-feslaRed hover:bg-red-700 text-white font-bold py-3 rounded-lg text-xs uppercase tracking-wider text-center flex items-center justify-center space-x-2 transition"
